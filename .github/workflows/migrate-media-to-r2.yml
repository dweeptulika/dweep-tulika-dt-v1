name: Migrate newsroom media to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      test_source:
        description: "Test read-only access to one Supabase S3 object"
        required: true
        type: boolean
        default: true
      apply:
        description: "Upload all media, verify each object, then update Neon URLs"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newsroom-r2-media-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/migration/reversible-backend-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/reversible-backend-adapter

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Migrate and verify media
        env:
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_ENDPOINT: https://zyqociykjtqgzzokpeck.storage.supabase.co/storage/v1/s3
          SUPABASE_S3_REGION: ap-south-1
          SUPABASE_S3_BUCKET: news-media
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          if [ "${{ inputs.test_source }}" = "true" ]; then
            npx tsx scripts/migrate-media-to-r2.ts --test-source
          elif [ "${{ inputs.apply }}" = "true" ]; then
            npx tsx scripts/migrate-media-to-r2.ts --apply
          else
            npx tsx scripts/migrate-media-to-r2.ts
          fi
